<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 13 — Biomech Three.js</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #050810; font-family: 'Segoe UI', system-ui, sans-serif; color: #c8d4e0; }
        canvas { display: block; }
        #info {
            position: fixed;
            top: 16px;
            left: 16px;
            padding: 12px 16px;
            background: rgba(8, 14, 22, 0.75);
            backdrop-filter: blur(6px);
            border: 1px solid rgba(100, 200, 255, 0.15);
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.6;
            max-width: 320px;
            pointer-events: none;
            z-index: 10;
        }
        #info h1 { font-size: 14px; color: #88ddee; margin-bottom: 6px; font-weight: 600; }
        #info .status { color: #cce0a0; }
        #info .error { color: #ff7a7a; }
        #info .stats { color: #88a0b8; font-size: 11px; margin-top: 4px; }
        #hint {
            position: fixed;
            bottom: 16px;
            right: 16px;
            padding: 8px 12px;
            background: rgba(8, 14, 22, 0.7);
            border-radius: 6px;
            font-size: 11px;
            color: #7a9aaa;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <canvas id="scene"></canvas>

    <div id="info">
        <h1>Lab 13 — Biomechaniczny Świat</h1>
        <div id="status" class="status">Ładowanie modelu...</div>
        <div id="stats" class="stats"></div>
    </div>

    <div id="hint">LMB: obrót · RMB: pan · Scroll: zoom</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module" src="./script.js"></script>
</body>
</html>
